# Drop Watch: refresh TCGplayer prices daily, after tcgcsv's ~20:00 UTC update.
name: Drop Watch prices
on:
  schedule:
    - cron: "40 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: market
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/market.py
      - name: Commit if changed
        run: |
          git add drops/market.json drops/market-history.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "Drop Watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Drop Watch: daily prices $(date -u +%F)"
          git push
