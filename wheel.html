<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Which ToastyBones Song Are You? | Slot Machine</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #000;
      background-image: url('tvbg.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: 'Share Tech Mono', monospace;
      color: #fff;
      overflow-x: hidden;
    }

    /* CRT overlay */
    #crt {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
    }
    #crt::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0,0,0,0.13) 2px, rgba(0,0,0,0.13) 4px);
    }
    #crt::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
    }

    /* Flash overlay */
    #flash {
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
      opacity: 0;
    }
    #flash.active {
      animation: flashAnim 0.35s ease-out forwards;
    }
    @keyframes flashAnim {
      0%   { opacity: 1; background: white; clip-path: inset(48% 0); }
      30%  { clip-path: inset(0%); background: white; opacity: 0.7; }
      60%  { background: repeating-linear-gradient(0deg, #000 0, #000 2px, #fff 2px, #fff 4px); opacity: 0.4; }
      100% { opacity: 0; }
    }

    /* Page layout */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1.5rem 1rem 5rem;
      gap: 1.2rem;
    }

    .back-link {
      align-self: flex-start;
      color: #fffb00;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .back-link:hover { opacity: 1; }

    /* Header */
    .header { text-align: center; }
    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.8rem, 6vw, 3.5rem);
      color: #fffb00;
      text-shadow: 0 0 10px #ff00ff, 0 0 25px #00ffff, -2px -2px 0 #000, 2px 2px 0 #000;
      animation: glitch 2s infinite;
      line-height: 1.1;
    }
    .header p {
      margin-top: 0.4rem;
      color: rgba(255,255,255,0.55);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
    }
    @keyframes glitch {
      0%,88%,100% { transform: translate(0); }
      90% { transform: translate(-3px,1px); }
      92% { transform: translate(3px,-1px); }
      94% { transform: translate(-1px,2px); }
    }

    /* Progress pips */
    .pips {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.35);
    }
    .pip {
      width: 12px; height: 12px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      background: transparent;
      transition: all 0.3s;
      flex-shrink: 0;
    }
    .pip.done  { background: #fffb00; border-color: #fffb00; box-shadow: 0 0 8px #fffb00; }
    .pip.active { background: #ff00cc; border-color: #ff00cc; box-shadow: 0 0 10px #ff00cc; animation: pipPulse 0.8s ease infinite; }
    @keyframes pipPulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.35); }
    }

    /* Phase label */
    .phase-label {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.75rem, 2.5vw, 1rem);
      letter-spacing: 0.2em;
      color: #ff00cc;
      text-shadow: 0 0 10px #ff00cc;
      text-align: center;
      min-height: 1.4em;
      transition: all 0.3s;
    }

    /* ══ SLOT MACHINE ══ */
    .machine-wrap {
      width: min(520px, 96vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Cabinet top bar */
    .cabinet-top {
      width: 100%;
      background: linear-gradient(180deg, #1a0a00 0%, #2d1500 100%);
      border: 3px solid #fffb00;
      border-bottom: none;
      border-radius: 1rem 1rem 0 0;
      padding: 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 0 20px rgba(255,251,0,0.2);
    }
    .cabinet-top .label {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: #fffb00;
      opacity: 0.7;
    }
    .cabinet-lights {
      display: flex;
      gap: 0.4rem;
    }
    .cabinet-lights span {
      width: 10px; height: 10px;
      border-radius: 50%;
      animation: cabinetBlink 1.8s ease-in-out infinite;
    }
    .cabinet-lights span:nth-child(1) { background: #ff0000; animation-delay: 0s; }
    .cabinet-lights span:nth-child(2) { background: #fffb00; animation-delay: 0.3s; }
    .cabinet-lights span:nth-child(3) { background: #00ff88; animation-delay: 0.6s; }
    .cabinet-lights span:nth-child(4) { background: #ff00cc; animation-delay: 0.9s; }
    .cabinet-lights span:nth-child(5) { background: #00ccff; animation-delay: 1.2s; }
    @keyframes cabinetBlink {
      0%,100% { opacity: 1; box-shadow: 0 0 6px currentColor; }
      50% { opacity: 0.25; box-shadow: none; }
    }

    /* Reel window */
    .reel-window {
      width: 100%;
      background: #000;
      border-left: 3px solid #fffb00;
      border-right: 3px solid #fffb00;
      position: relative;
      overflow: hidden;
      height: 260px;
    }

    /* Top/bottom gradient fades */
    .reel-window::before,
    .reel-window::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      z-index: 10;
      pointer-events: none;
    }
    .reel-window::before {
      top: 0;
      height: 80px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, transparent 100%);
    }
    .reel-window::after {
      bottom: 0;
      height: 80px;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 100%);
    }

    /* Center highlight bar */
    .reel-center-bar {
      position: absolute;
      top: 50%;
      left: 0; right: 0;
      transform: translateY(-50%);
      height: 80px;
      border-top: 2px solid rgba(255,251,0,0.5);
      border-bottom: 2px solid rgba(255,251,0,0.5);
      background: rgba(255,251,0,0.04);
      z-index: 9;
      pointer-events: none;
    }

    /* The reel strip */
    .reel-strip {
      position: absolute;
      left: 0; right: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      will-change: transform;
    }

    .reel-item {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 1.5rem;
      text-align: center;
      flex-shrink: 0;
      transition: none;
    }

    .reel-item .item-text {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.85rem, 3vw, 1.25rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.05em;
      color: #fff;
      text-shadow: 0 0 10px currentColor;
    }

    .reel-item.center-item .item-text {
      color: #fffb00;
      text-shadow: 0 0 15px #ff00ff, 0 0 30px #00ffff;
    }

    /* Cabinet bottom / button area */
    .cabinet-bottom {
      width: 100%;
      background: linear-gradient(180deg, #2d1500 0%, #1a0a00 100%);
      border: 3px solid #fffb00;
      border-top: none;
      border-radius: 0 0 1rem 1rem;
      padding: 1.2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      box-shadow: 0 0 20px rgba(255,251,0,0.2);
    }

    /* Lever / pull handle visual */
    .lever-area {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
      justify-content: center;
    }

    .lever {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      cursor: pointer;
      user-select: none;
    }
    .lever-ball {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff6600, #cc3300);
      border: 3px solid #ff9900;
      box-shadow: 0 0 12px rgba(255,100,0,0.6);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .lever-shaft {
      width: 6px;
      height: 60px;
      background: linear-gradient(180deg, #888 0%, #444 100%);
      border-radius: 3px;
      border: 1px solid #666;
    }
    .lever-base {
      width: 24px; height: 8px;
      background: #444;
      border-radius: 2px;
      border: 1px solid #666;
    }

    .lever:hover .lever-ball,
    .lever:not(.disabled):active .lever-ball {
      transform: translateY(8px);
      box-shadow: 0 0 20px rgba(255,100,0,0.9);
    }

    .lever.pulling .lever-ball {
      transform: translateY(48px);
      box-shadow: 0 0 24px rgba(255,100,0,1);
      transition: transform 0.18s ease-in, box-shadow 0.18s ease-in;
    }
    .lever.springing .lever-ball {
      transform: translateY(0px);
      box-shadow: 0 0 10px rgba(255,100,0,0.5);
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease;
    }

    .lever.disabled { cursor: not-allowed; opacity: 0.35; }
    .lever.disabled .lever-ball { transform: none !important; }

    .spin-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1rem, 3.5vw, 1.4rem);
      font-weight: 900;
      letter-spacing: 0.15em;
      background: linear-gradient(135deg, #fffb00 0%, #ffcc00 100%);
      color: #000;
      border: none;
      padding: 1rem 3rem;
      border-radius: 0.5rem;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255,251,0,0.5), 0 4px 0 #aa9900;
      transition: all 0.15s;
      text-transform: uppercase;
      position: relative;
      top: 0;
    }
    .spin-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #ff00cc 0%, #cc0099 100%);
      color: #fff;
      box-shadow: 0 0 30px rgba(255,0,204,0.7), 0 4px 0 #880066;
    }
    .spin-btn:active:not(:disabled) {
      top: 4px;
      box-shadow: 0 0 20px rgba(255,251,0,0.5), 0 0px 0 #aa9900;
    }
    .spin-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      top: 0;
    }

    /* Coin slot decoration */
    .coin-slot {
      width: 60px;
      height: 6px;
      background: #000;
      border: 2px solid #555;
      border-radius: 3px;
      margin-top: 0.2rem;
    }

    /* Result card */
    #result-card {
      width: min(520px, 96vw);
      background: rgba(0,0,0,0.92);
      border: 2px solid #fffb00;
      border-radius: 1rem;
      padding: 1.5rem 1.5rem 1.2rem;
      text-align: center;
      box-shadow: 0 0 30px rgba(255,251,0,0.15), inset 0 0 40px rgba(0,0,0,0.6);
      display: none;
    }
    #result-card.visible {
      display: block;
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.88) translateY(16px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .res-from {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.4);
      margin-bottom: 0.3rem;
    }
    .res-album-name {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.85rem, 2.5vw, 1.2rem);
      color: #ff00cc;
      text-shadow: 0 0 8px #ff00cc;
      margin-bottom: 0.6rem;
    }
    .res-you-are {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.4);
      margin-bottom: 0.3rem;
    }
    .res-song-name {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.3rem, 4.5vw, 2.2rem);
      color: #fffb00;
      text-shadow: 0 0 15px #ff00ff, 0 0 30px #00ffff;
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }
    .res-verdict {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.45);
      font-style: italic;
      margin-bottom: 1rem;
    }
    #spotify-wrap {
      border-radius: 0.75rem;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .res-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-spotify {
      background: #1db954;
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 0.6rem 1.2rem;
      border-radius: 0.4rem;
      text-decoration: none;
      letter-spacing: 0.1em;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }
    .btn-spotify:hover { background: #17a349; transform: scale(1.04); }
    .btn-ytmusic {
      background: #ff0000;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 0.6rem 1.2rem;
      border-radius: 0.4rem;
      text-decoration: none;
      letter-spacing: 0.1em;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }
    .btn-ytmusic:hover { background: #cc0000; transform: scale(1.04); }
    .btn-again {
      background: transparent;
      color: #fffb00;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 0.6rem 1.2rem;
      border-radius: 0.4rem;
      border: 2px solid #fffb00;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-again:hover { background: #fffb00; color: #000; }

    /* Thunk shake */
    @keyframes thunkShake {
      0%  { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
      100%{ transform: translateX(0); }
    }
    .thunk { animation: thunkShake 0.25s ease forwards; }

    /* Intermediate album reveal */
    #album-reveal {
      width: min(520px, 96vw);
      background: rgba(0,0,0,0.7);
      border: 2px solid #ff00cc;
      border-radius: 0.75rem;
      padding: 0.8rem 1.5rem;
      text-align: center;
      display: none;
      box-shadow: 0 0 20px rgba(255,0,204,0.2);
    }
    #album-reveal.visible { display: block; animation: popIn 0.3s ease forwards; }
    #album-reveal p:first-child {
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.4);
      margin-bottom: 0.2rem;
    }
    #album-reveal p:last-child {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.9rem, 3vw, 1.3rem);
      color: #ff00cc;
      text-shadow: 0 0 10px #ff00cc;
    }
    /* ============ SIDE DECORATIONS ============ */
    .side-deco {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 80px;
      z-index: 1;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      padding: 2rem 0;
      gap: 1rem;
    }

    .side-deco.left  { left: 0; }
    .side-deco.right { right: 0; }

    @media (max-width: 900px) { .side-deco { display: none; } }

    .deco-skull {
      font-size: 1.8rem;
      opacity: 0.35;
      animation: decoFloat 4s ease-in-out infinite;
      filter: drop-shadow(0 0 6px #ff00ff);
    }

    .deco-skull:nth-child(2) { animation-delay: 1s; font-size: 1.2rem; opacity: 0.2; }
    .deco-skull:nth-child(3) { animation-delay: 2s; font-size: 2.2rem; opacity: 0.25; filter: drop-shadow(0 0 8px #00ffff); }
    .deco-skull:nth-child(4) { animation-delay: 0.5s; font-size: 1rem; opacity: 0.15; }
    .deco-skull:nth-child(5) { animation-delay: 3s; font-size: 1.5rem; opacity: 0.3; filter: drop-shadow(0 0 6px #fffb00); }

    @keyframes decoFloat {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50%       { transform: translateY(-12px) rotate(5deg); }
    }

    .deco-bar {
      width: 2px;
      height: 60px;
      background: linear-gradient(to bottom, transparent, #ff00ff, transparent);
      opacity: 0.3;
      animation: decoBar 2s ease-in-out infinite;
    }

    .deco-bar:nth-child(even) {
      background: linear-gradient(to bottom, transparent, #00ffff, transparent);
      animation-delay: 1s;
    }

    @keyframes decoBar {
      0%, 100% { opacity: 0.15; transform: scaleY(1); }
      50%       { opacity: 0.5;  transform: scaleY(1.3); }
    }

    .deco-static {
      width: 50px;
      height: 50px;
      border: 1px solid rgba(255,251,0,0.2);
      border-radius: 4px;
      overflow: hidden;
      opacity: 0.25;
      animation: staticFlash 0.3s steps(1) infinite;
      background: repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.1) 0px, rgba(255,255,255,0.1) 2px,
        transparent 2px, transparent 6px
      );
    }

    @keyframes staticFlash {
      0%   { background-position: 0 0; opacity: 0.2; }
      25%  { background-position: 5px -3px; opacity: 0.3; }
      50%  { background-position: -3px 5px; opacity: 0.15; }
      75%  { background-position: 3px 3px; opacity: 0.25; }
      100% { background-position: 0 0; opacity: 0.2; }
    }
</head>
<body>

<div id="crt" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>

<!-- Left side decorations -->
<div class="side-deco left" aria-hidden="true">
  <div class="deco-skull">☠️</div>
  <div class="deco-bar"></div>
  <div class="deco-skull">🍞</div>
  <div class="deco-static"></div>
  <div class="deco-bar"></div>
  <div class="deco-skull">☠️</div>
  <div class="deco-bar"></div>
  <div class="deco-static"></div>
  <div class="deco-skull">🎰</div>
</div>

<!-- Right side decorations -->
<div class="side-deco right" aria-hidden="true">
  <div class="deco-skull">🍞</div>
  <div class="deco-bar"></div>
  <div class="deco-static"></div>
  <div class="deco-skull">☠️</div>
  <div class="deco-bar"></div>
  <div class="deco-skull">🎰</div>
  <div class="deco-static"></div>
  <div class="deco-bar"></div>
  <div class="deco-skull">🍞</div>
</div>

<div class="page">

  <a href="index.html" class="back-link">← Back to ToastyBones</a>

  <div class="header">
    <h1>☠️ Slot of Fate ☠️</h1>
    <p>Which ToastyBones song are you?</p>
  </div>

  <div class="pips">
    <span class="pip active" id="pip1"></span>
    <span>SPIN 1: ALBUM</span>
    <span style="opacity:0.2; padding: 0 0.2rem;">—</span>
    <span class="pip" id="pip2"></span>
    <span>SPIN 2: SONG</span>
  </div>

  <p class="phase-label" id="phase-label">PULL THE LEVER TO CHOOSE YOUR ALBUM</p>

  <!-- Slot Machine -->
  <div class="machine-wrap">

    <div class="cabinet-top">
      <div class="cabinet-lights">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="label">TOASTYBONES INDUSTRIES</div>
      <div class="cabinet-lights">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="reel-window" id="reel-window">
      <div class="reel-center-bar"></div>
      <div class="reel-strip" id="reel-strip"></div>
    </div>

    <div class="cabinet-bottom">
      <div class="lever-area">
        <div class="lever" id="lever" onclick="pull()">
          <div class="lever-ball"></div>
          <div class="lever-shaft"></div>
          <div class="lever-base"></div>
        </div>
        <button class="spin-btn" id="spin-btn" onclick="pull()">PULL THE LEVER</button>
      </div>
      <div class="coin-slot"></div>
    </div>

  </div>

  <!-- Album reveal (between spins) -->
  <div id="album-reveal">
    <p>YOUR ALBUM</p>
    <p id="album-reveal-name"></p>
  </div>

  <!-- Final result card -->
  <div id="result-card">
    <div class="res-from" id="res-from"></div>
    <div class="res-album-name" id="res-album-name"></div>
    <div class="res-you-are">☠️ YOU ARE</div>
    <div class="res-song-name" id="res-song-name"></div>
    <div class="res-verdict" id="res-verdict"></div>
    <div id="spotify-wrap"></div>
    <div class="res-actions">

//  STATE
// ══════════════════════════════════════════════
const ITEM_H = 80;         // px per reel item

let phase = 1;
let spinning = false;
let currentItems = [];     // array of {name, color} for current reel
let reelY = 0;             // current translateY of strip
let chosenAlbum = null;
let raf = null;

const strip = document.getElementById('reel-strip');
const flashEl = document.getElementById('flash');
const spinBtn = document.getElementById('spin-btn');
const lever = document.getElementById('lever');

// ── Build reel DOM ──
// COPIES: enough that even a fast long spin never runs off the end.
// With 20 copies of even 6 items = 9600px, more than enough for any spin.
const COPIES = 20;

function buildReel(items, startIndex) {
  strip.innerHTML = '';
  for (let c = 0; c < COPIES; c++) {
    items.forEach((item) => {
      const div = document.createElement('div');
      div.className = 'reel-item';
      div.style.background = `linear-gradient(135deg, ${item.color}18 0%, transparent 100%)`;
      div.style.borderBottom = `1px solid rgba(255,255,255,0.06)`;
      const p = document.createElement('p');
      p.className = 'item-text';
      p.style.color = item.color || '#fffb00';
      p.textContent = item.name;
      div.appendChild(p);
      strip.appendChild(div);
    });
  }

  // Start positioned at copy #2 (index COPIES/2) so we have room to scroll down
  // without normalization ever being needed during the spin.
  // Center offset: window center is at ITEM_H (one item height from top of visible area)
  const startCopy = Math.floor(COPIES / 2);
  reelY = -(startCopy * items.length * ITEM_H + startIndex * ITEM_H) + ITEM_H;
  strip.style.transform = `translateY(${reelY}px)`;
  highlightCenter(items);
}

function highlightCenter(items) {
  const n = items.length;
  const allItems = strip.querySelectorAll('.reel-item');
  allItems.forEach(el => el.classList.remove('center-item'));
  const centered = getCenteredIndex(items);
  allItems.forEach((el, i) => {
    if (i % n === centered) el.classList.add('center-item');
  });
}

function getCenteredIndex(items) {
  const n = items.length;
  // Which item index sits at the center of the window?
  // Center px from top of strip = -reelY + ITEM_H
  const centerPx = -reelY + ITEM_H;
  let idx = Math.round(centerPx / ITEM_H) % n;
  if (idx < 0) idx += n;
  return idx;
}

// ── Spin physics ──
function pull() {
  if (spinning) return;
  animateLever();
  startSpin();
}

// ── Lever animation ──
function animateLever() {
  lever.classList.remove('springing');
  lever.classList.add('pulling');
  setTimeout(() => {
    lever.classList.remove('pulling');
    lever.classList.add('springing');
    setTimeout(() => lever.classList.remove('springing'), 400);
  }, 200);
}

// ── Web Audio sound engine ──
let audioCtx = null;

function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTick(pitch = 220, duration = 0.04, volume = 0.15) {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(pitch, ctx.currentTime);
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}

function playThunk() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(90, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(28, ctx.currentTime + 0.18);
    gain.gain.setValueAtTime(0.7, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.25);
    // click layer
    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.connect(gain2); gain2.connect(ctx.destination);
    osc2.type = 'square';
    osc2.frequency.setValueAtTime(900, ctx.currentTime);
    gain2.gain.setValueAtTime(0.25, ctx.currentTime);
    gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
    osc2.start(ctx.currentTime); osc2.stop(ctx.currentTime + 0.05);
  } catch(e) {}
}

function playFanfare() {
  try {
    const ctx = getAudio();
    [523, 659, 784, 1047].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'square';
      const t = ctx.currentTime + i * 0.11;
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.16, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      osc.start(t); osc.stop(t + 0.22);
    });
  } catch(e) {}
}

let lastTickY = 0;

function startSpin() {
  spinning = true;
  spinBtn.disabled = true;
  lever.classList.add('disabled');
  document.getElementById('result-card').classList.remove('visible');
  document.getElementById('album-reveal').classList.remove('visible');

  const items = currentItems;
  const n = items.length;

  const realTargetIdx = Math.floor(Math.random() * n);

  // Near-miss: 25% chance — land one item early, pause, lurch forward
  const doNearMiss = Math.random() < 0.25;
  const nearMissIdx = ((realTargetIdx - 1) + n) % n;
  const firstTargetIdx = doNearMiss ? nearMissIdx : realTargetIdx;

  const loops = 6 + Math.floor(Math.random() * 5);
  const currentCenter = getCenteredIndex(items);
  let extraSteps = firstTargetIdx - currentCenter;
  if (extraSteps <= 0) extraSteps += n;
  const totalDist = (loops * n + extraSteps) * ITEM_H;

  const startY = reelY;
  const endY = startY - totalDist;
  const duration = doNearMiss ? 2200 : (2400 + Math.random() * 500);
  const startTime = performance.now();
  lastTickY = reelY;

  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

  function animate(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / duration, 1);
    reelY = startY + (endY - startY) * easeOut(t);
    strip.style.transform = `translateY(${reelY}px)`;

    // Tick sound on each item boundary crossed
    if (Math.floor((lastTickY - reelY) / ITEM_H) > 0) {
      const speed = Math.abs(reelY - lastTickY);
      const pitch = Math.max(80, Math.min(380, 380 - speed * 0.7));
      playTick(pitch, 0.035, 0.12);
      lastTickY = reelY - ((lastTickY - reelY) % ITEM_H);
    }

    if (t < 1) {
      raf = requestAnimationFrame(animate);
    } else {
      reelY = endY;
      strip.style.transform = `translateY(${reelY}px)`;
      highlightCenter(items);
      if (doNearMiss) {
        playThunk();
        setTimeout(() => doLurch(items, realTargetIdx), 620);
      } else {
        playThunk();
        onLanded(realTargetIdx);
      }
    }
  }
  lastTickY = reelY;
  raf = requestAnimationFrame(animate);
}

// Near-miss lurch: snap exactly one item forward
function doLurch(items, targetIdx) {
  const startY = reelY;
  const endY = startY - ITEM_H;
  const duration = 270;
  const startTime = performance.now();
  function animate(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    reelY = startY + (endY - startY) * eased;
    strip.style.transform = `translateY(${reelY}px)`;
    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      reelY = endY;
      strip.style.transform = `translateY(${reelY}px)`;
      highlightCenter(items);
      playThunk();
      onLanded(targetIdx);
    }
  }
  requestAnimationFrame(animate);
}

function onLanded(idx) {
  spinning = false;

  flashEl.classList.remove('active');
  void flashEl.offsetWidth;
  flashEl.classList.add('active');
  setTimeout(() => flashEl.classList.remove('active'), 400);

  const machineWrap = document.querySelector('.machine-wrap');
  machineWrap.classList.remove('thunk');
  void machineWrap.offsetWidth;
  machineWrap.classList.add('thunk');

  if (phase === 1) {
    chosenAlbum = ALBUMS[idx];
    afterAlbumSpin(chosenAlbum);
  } else {
    const song = chosenAlbum.songs[idx];
    playFanfare();
    showFinalResult(chosenAlbum, song);
  }
}

function afterAlbumSpin(album) {
  document.getElementById('album-reveal-name').textContent = album.name;
  document.getElementById('album-reveal').classList.add('visible');

  phase = 2;
  document.getElementById('pip1').className = 'pip done';
  document.getElementById('pip2').className = 'pip active';
  document.getElementById('phase-label').textContent = 'NOW PULL FOR YOUR SONG';
  spinBtn.textContent = 'PULL FOR YOUR SONG';
  spinBtn.disabled = false;
  lever.classList.remove('disabled');

  setTimeout(() => {
    currentItems = album.songs.map(s => ({ name: s.name, color: album.color }));
    buildReel(currentItems, 0);
  }, 400);
}

function showFinalResult(album, song) {
  const card = document.getElementById('result-card');
  document.getElementById('res-from').textContent = `FROM: ${album.name}`;
  document.getElementById('res-album-name').textContent = '';
  document.getElementById('res-song-name').textContent = `"${song.name}"`;
  document.getElementById('res-verdict').textContent = getVerdict();
  // autoplay=1 starts the track immediately
  document.getElementById('spotify-wrap').innerHTML = `
    <iframe style="border-radius:8px"
      src="https://open.spotify.com/embed/track/${song.id}?utm_source=generator&theme=0&autoplay=1"
      width="100%" height="152" frameBorder="0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="eager"></iframe>`;
  document.getElementById('btn-spotify').href = `https://open.spotify.com/track/${song.id}`;
  document.getElementById('btn-ytmusic').href = `https://music.youtube.com/search?q=ToastyBones+${encodeURIComponent(song.name)}`;
  card.classList.add('visible');

  document.getElementById('pip2').className = 'pip done';
  document.getElementById('phase-label').textContent = 'DESTINY REVEALED ☠️';
  spinBtn.disabled = true;
  lever.classList.add('disabled');
}

function getVerdict() {
  const v = [
    "The bones have spoken.",
    "This is simply who you are now.",
    "You didn't choose the song. The song chose you.",
    "Destiny smells faintly of toast.",
    "Congratulations. This is your personality.",
    "Science cannot explain this. But here we are.",
    "Tell everyone. They need to know.",
    "This is canon.",
    "The slot has never been wrong. Never.",
    "You may update your bio accordingly.",
    "The universe had to think about this one.",
    "Completely accurate. No notes.",
    "The machine is never wrong. The machine is never wrong.",
    "Certified. Notarized. Toasty.",
  ];
  return v[Math.floor(Math.random() * v.length)];
}

function resetMachine() {
  phase = 1;
  chosenAlbum = null;
  document.getElementById('result-card').classList.remove('visible');
  document.getElementById('album-reveal').classList.remove('visible');
  document.getElementById('pip1').className = 'pip active';
  document.getElementById('pip2').className = 'pip';
  document.getElementById('phase-label').textContent = 'PULL THE LEVER TO CHOOSE YOUR ALBUM';
  spinBtn.textContent = 'PULL THE LEVER';
  spinBtn.disabled = false;
  lever.classList.remove('disabled');
  initAlbumReel();
}

function initAlbumReel() {
  currentItems = ALBUMS.map(a => ({ name: a.name, color: a.color }));
  buildReel(currentItems, Math.floor(Math.random() * currentItems.length));
}

// ── Init ──
initAlbumReel();
</script>
