    html, body {
      min-height: 100%;
      background: #000;
      background-image: url('tvbg.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: 'Share Tech Mono', monospace;
      color: #fff;
      overflow-x: hidden;
    }

    /* ── CRT overlay ── */
    #crt {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
    }
    #crt::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0,0,0,0.14) 2px, rgba(0,0,0,0.14) 4px);
    }
    #crt::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
    }

    /* ── Layout ── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
      gap: 1.5rem;
    }

    /* ── Back link ── */
    .back-link {
      align-self: flex-start;
      color: #fffb00;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .back-link:hover { opacity: 1; }

    /* ── Header ── */
    .header {
      text-align: center;
    }
    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.4rem, 5vw, 2.8rem);
      color: #fffb00;
      text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff, -2px -2px 0 #000, 2px 2px 0 #000;
      animation: glitch 1.5s infinite;
      line-height: 1.2;
    }
    .header p {
      margin-top: 0.5rem;
      color: rgba(255,255,255,0.6);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
    }

    @keyframes glitch {
      0%, 90%, 100% { transform: translate(0); }
      92% { transform: translate(-2px, 1px); }
      94% { transform: translate(2px, -1px); }
      96% { transform: translate(-1px, 2px); }
    }

    /* ── Phase label ── */
    .phase-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: #ff00cc;
      text-shadow: 0 0 8px #ff00cc;
      text-transform: uppercase;
      transition: opacity 0.4s;
    }

    /* ── Wheel container ── */
    .wheel-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      width: 100%;
    }

    .wheel-wrap {
      position: relative;
      width: min(380px, 90vw);
      height: min(380px, 90vw);
      flex-shrink: 0;
    }

    /* Pointer triangle at top */
    .pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 28px solid #fffb00;
      filter: drop-shadow(0 0 8px #fffb00);
      z-index: 10;
    }

    canvas#wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(255,0,255,0.4), 0 0 60px rgba(0,255,255,0.2);
    }

    /* Center hub */
    .hub {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      background: #000;
      border: 3px solid #fffb00;
      border-radius: 50%;
      box-shadow: 0 0 12px #fffb00;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      z-index: 5;
      pointer-events: none;
    }

    /* ── Spin button ── */
    .spin-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.9rem, 3vw, 1.2rem);
      font-weight: 900;
      letter-spacing: 0.15em;
      background: #fffb00;
      color: #000;
      border: none;
      padding: 0.9rem 2.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255,251,0,0.5);
      transition: all 0.2s;
      text-transform: uppercase;
    }
    .spin-btn:hover:not(:disabled) {
      background: #ff00cc;
      color: #fff;
      box-shadow: 0 0 30px rgba(255,0,204,0.7);
      transform: scale(1.04);
    }
    .spin-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Result card ── */
    #result-card {
      width: min(480px, 94vw);
      background: rgba(0,0,0,0.8);
      border: 2px solid #fffb00;
      border-radius: 1rem;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 0 30px rgba(255,251,0,0.15);
      display: none;
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }

    #result-card.visible { display: block; }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.85) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .result-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .result-album {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1rem, 3.5vw, 1.5rem);
      color: #fffb00;
      text-shadow: 0 0 10px #ff00ff;
      margin-bottom: 0.3rem;
    }

    .result-song {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.2rem, 4vw, 2rem);
      color: #fff;
      text-shadow: 0 0 15px #00ffff;
      margin: 0.5rem 0 1rem;
      line-height: 1.3;
    }

    .result-verdict {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      margin-bottom: 1.2rem;
      font-style: italic;
    }

    /* Spotify embed */
    #spotify-wrap {
      border-radius: 0.75rem;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .result-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-spotify {
      background: #1db954;
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 0.6rem 1.2rem;
      border-radius: 0.4rem;
      text-decoration: none;
      letter-spacing: 0.1em;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }
    .btn-spotify:hover { background: #17a349; transform: scale(1.04); }

    .btn-again {
      background: transparent;
      color: #fffb00;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 0.6rem 1.2rem;
      border-radius: 0.4rem;
      border: 2px solid #fffb00;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-again:hover { background: #fffb00; color: #000; }

    /* ── Progress pips ── */
    .pips {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }
    .pip {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      transition: all 0.3s;
    }
    .pip.done { background: #fffb00; box-shadow: 0 0 6px #fffb00; border-color: #fffb00; }
    .pip.active { background: #ff00cc; box-shadow: 0 0 8px #ff00cc; border-color: #ff00cc; animation: pipPulse 0.8s ease infinite; }

    @keyframes pipPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    /* ── Thunk effect ── */
    @keyframes thunk {
      0% { transform: scale(1); }
      30% { transform: scale(1.06); }
      60% { transform: scale(0.97); }
      100% { transform: scale(1); }
    }
    .thunk { animation: thunk 0.35s ease forwards; }

    /* ── Channel change flash ── */
    #flash {
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
      opacity: 0;
    }
    #flash.active {
      animation: flashAnim 0.4s ease-out forwards;
    }
    @keyframes flashAnim {
      0% { opacity: 1; background: white; clip-path: inset(45% 0); }
      25% { clip-path: inset(0%); background: white; opacity: 0.8; }
      50% { background: repeating-linear-gradient(0deg, #000 0px, #000 2px, #fff 2px, #fff 4px); opacity: 0.5; }
      100% { opacity: 0; }
    }
  </style>

// ══════════════════════════════════════════════
//  WHEEL ENGINE
// ══════════════════════════════════════════════
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height, R = W / 2 - 8;
const CX = W / 2, CY = H / 2;

let phase = 1; // 1 = album spin, 2 = song spin
let spinning = false;
let angle = 0;
let velocity = 0;
let items = []; // current wheel items
let chosenAlbum = null;
let chosenSong = null;

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

function darken(hex, factor=0.4) {
  const {r,g,b} = hexToRgb(hex);
  return `rgb(${Math.floor(r*factor)},${Math.floor(g*factor)},${Math.floor(b*factor)})`;
}

function drawWheel(items, currentAngle) {
  const n = items.length;
  const slice = (2 * Math.PI) / n;

  ctx.clearRect(0, 0, W, H);

  // Shadow ring
  ctx.save();
  ctx.shadowColor = 'rgba(255,0,255,0.4)';
  ctx.shadowBlur = 30;
  ctx.beginPath();
  ctx.arc(CX, CY, R + 4, 0, 2 * Math.PI);
  ctx.strokeStyle = 'rgba(255,0,255,0.3)';
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.restore();

  for (let i = 0; i < n; i++) {
    const startAngle = currentAngle + i * slice;
    const endAngle = startAngle + slice;
    const color = items[i].color || '#fffb00';

    // Wedge fill
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = (i % 2 === 0) ? color : darken(color, 0.55);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Text
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(startAngle + slice / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 4;

    const label = items[i].name || items[i];
    const fontSize = n <= 8 ? 14 : n <= 14 ? 11 : 9;
    ctx.font = `bold ${fontSize}px "Share Tech Mono", monospace`;

    // Truncate long names
    const maxLen = n <= 8 ? 22 : n <= 14 ? 18 : 14;
    const text = label.length > maxLen ? label.slice(0, maxLen - 1) + '…' : label;
    ctx.fillText(text, R - 14, 4);
    ctx.restore();
  }

  // Outer ring
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, 2 * Math.PI);
  ctx.strokeStyle = 'rgba(255,251,0,0.6)';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function getLandedIndex(items, currentAngle) {
  const n = items.length;
  const slice = (2 * Math.PI) / n;
  // Pointer is at top = -PI/2
  const normalized = ((-currentAngle - Math.PI / 2) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
  return Math.floor(normalized / slice) % n;
}

function initAlbumWheel() {
  items = ALBUMS.map(a => ({ name: a.name, color: a.color }));
  angle = Math.random() * 2 * Math.PI;
  drawWheel(items, angle);
}

function initSongWheel(album) {
  items = album.songs.map(s => ({ name: s.name, color: album.color }));
  // Alternate colors slightly
  items = items.map((s, i) => ({
    ...s,
    color: i % 2 === 0 ? album.color : darken(album.color, 0.7)
  }));
  angle = Math.random() * 2 * Math.PI;
  drawWheel(items, angle);
}

let raf;
function spin() {
  if (spinning) return;
  spinning = true;
  document.getElementById('spin-btn').disabled = true;
  document.getElementById('result-card').classList.remove('visible');

  // Random velocity: 25-40 full rotations worth
  velocity = (25 + Math.random() * 15) * (2 * Math.PI / 60);

  function animate() {
    velocity *= 0.985; // friction
    angle += velocity;
    drawWheel(items, angle);

    if (velocity > 0.003) {
      raf = requestAnimationFrame(animate);
    } else {
      // Landed!
      spinning = false;
      onLanded();
    }
  }
  raf = requestAnimationFrame(animate);
}

function onLanded() {
  const idx = getLandedIndex(items, angle);
  const flashEl = document.getElementById('flash');

  // Thunk the hub
  const hub = document.querySelector('.hub');
  hub.classList.remove('thunk');
  void hub.offsetWidth;
  hub.classList.add('thunk');

  flashEl.classList.remove('active');
  void flashEl.offsetWidth;
  flashEl.classList.add('active');
  setTimeout(() => flashEl.classList.remove('active'), 450);

  if (phase === 1) {
    // Album chosen
    chosenAlbum = ALBUMS[idx];
    showAlbumResult(chosenAlbum);
  } else {
    // Song chosen
    chosenSong = chosenAlbum.songs[idx];
    showFinalResult(chosenAlbum, chosenSong);
  }
}

function showAlbumResult(album) {
  const card = document.getElementById('result-card');
  document.getElementById('res-label').textContent = '🎵 YOUR ALBUM IS';
  document.getElementById('res-album').textContent = album.name;
  document.getElementById('res-song-label').style.display = 'none';
  document.getElementById('res-song').textContent = '';
  document.getElementById('res-verdict').textContent = 'Now spin again to find your song...';
  document.getElementById('spotify-wrap').innerHTML = '';
  document.getElementById('btn-spotify').href = `https://open.spotify.com/album/${album.id}`;
  document.getElementById('btn-spotify').textContent = '▶ OPEN ALBUM';
  card.classList.add('visible');

  // Move to phase 2
  phase = 2;
  document.getElementById('pip1').className = 'pip done';
  document.getElementById('pip2').className = 'pip active';
  document.getElementById('phase-label').textContent = 'NOW SPIN FOR YOUR SONG';
  document.getElementById('spin-btn').textContent = 'SPIN FOR YOUR SONG';
  document.getElementById('spin-btn').disabled = false;

  // Rebuild wheel with songs
  setTimeout(() => initSongWheel(album), 300);
}

function showFinalResult(album, song) {
  const card = document.getElementById('result-card');
  document.getElementById('res-label').textContent = `FROM: ${album.name}`;
  document.getElementById('res-album').textContent = '';
  const songLabel = document.getElementById('res-song-label');
  songLabel.style.display = 'block';
  songLabel.textContent = '☠️ YOU ARE';
  document.getElementById('res-song').textContent = `"${song.name}"`;
  document.getElementById('res-verdict').textContent = getVerdict(song.name);

  // Spotify track embed
  document.getElementById('spotify-wrap').innerHTML = `
    <iframe style="border-radius:8px" 
      src="https://open.spotify.com/embed/track/${song.id}?utm_source=generator&theme=0" 
      width="100%" height="152" frameBorder="0" 
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
      loading="lazy">
    </iframe>`;

  document.getElementById('btn-spotify').href = `https://open.spotify.com/track/${song.id}`;
  document.getElementById('btn-spotify').textContent = '▶ OPEN IN SPOTIFY';
  card.classList.add('visible');

  document.getElementById('pip2').className = 'pip done';
  document.getElementById('phase-label').textContent = 'DESTINY REVEALED';
  document.getElementById('spin-btn').disabled = true;
}

function getVerdict(songName) {
  const verdicts = [
    "The bones have spoken.",
    "This is simply who you are now.",
    "You didn't choose the song. The song chose you.",
    "Destiny smells faintly of toast.",
    "Congratulations. This is your personality.",
    "Science cannot explain this. But here we are.",
    "Tell everyone. They need to know.",
    "This is canon.",
    "The wheel has never been wrong. The wheel is never wrong.",
    "You may update your bio accordingly.",
    "The universe had to think about this one.",
    "Completely accurate. No notes.",
  ];
  return verdicts[Math.floor(Math.random() * verdicts.length)];
}

function resetWheel() {
  phase = 1;
  chosenAlbum = null;
  chosenSong = null;
  document.getElementById('result-card').classList.remove('visible');
  document.getElementById('pip1').className = 'pip active';
  document.getElementById('pip2').className = 'pip';
  document.getElementById('phase-label').textContent = 'SPIN TO CHOOSE YOUR ALBUM';
  document.getElementById('spin-btn').textContent = 'SPIN THE WHEEL';
  document.getElementById('spin-btn').disabled = false;
  initAlbumWheel();
}

// Init
initAlbumWheel();
</script>
