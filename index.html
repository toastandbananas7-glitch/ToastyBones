
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToastyBones</title>

<meta name="description" content="ToastyBones - AI-powered pop punk chaos.">
<meta property="og:title" content="ToastyBones">
<meta property="og:description" content="Glitchy Pop Punk Mayhem">
<meta property="og:image" content="HilariouslyUnfortunate.png">
<meta property="og:type" content="website">

<link rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
html, body {
  margin:0;
  padding:0;
  background:url('tvbg.png') center/cover fixed no-repeat #000;
  font-family:'Share Tech Mono', monospace;
  color:#fff;
  scroll-behavior:smooth;
}

/* CRT */
body.crt::after{
  content:"";
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0.25),
    rgba(0,0,0,0.25) 2px,
    transparent 2px,
    transparent 4px
  );
  pointer-events:none;
  z-index:9999;
}

/* CRT Toggle Button */
#crtToggle{
  position:fixed;
  top:15px;
  right:20px;
  z-index:10000;
  background:#ff00ff;
  color:#fff;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  box-shadow:0 0 10px #ff00ff;
}

/* Floating Merch Button */
#floatingMerch{
  position:fixed;
  left:0;
  top:40%;
  background:#ff0080;
  padding:14px 18px;
  border-radius:0 12px 12px 0;
  font-weight:bold;
  box-shadow:0 0 15px #ff0080;
  z-index:1000;
}

/* Merch Scrolling Banner */
#merchBanner{
  white-space:nowrap;
  overflow:hidden;
  background:#000;
  border-top:3px solid #ff00ff;
  border-bottom:3px solid #00ffff;
}
#merchBanner img{
  height:140px;
  animation:scrollMerch 25s linear infinite;
}
@keyframes scrollMerch{
  from{transform:translateX(100%);}
  to{transform:translateX(-100%);}
}

/* Section Titles */
.section-title{
  font-family:'Orbitron', sans-serif;
  font-size:2.2rem;
  text-align:center;
  margin:2rem 0;
  color:#fffb00;
  text-shadow:0 0 8px #ff00ff, 0 0 15px #00ffff;
}

/* Album Cards */
.album-card{
  background:rgba(0,0,0,0.65);
  border-radius:14px;
  overflow:hidden;
  border:2px solid #00ffff;
  transition:transform .3s ease, box-shadow .3s ease;
  position:relative;
}
.album-card:hover{
  transform:scale(1.05) rotate(1.5deg);
  box-shadow:0 0 25px #ff00ff, 0 0 40px #00ffff;
}

/* Glitch Overlay */
.album-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(45deg, transparent 40%, rgba(255,0,255,0.2) 50%, transparent 60%);
  opacity:0;
  transition:opacity .2s;
}
.album-card:hover::before{
  opacity:1;
  animation:glitch .3s infinite;
}
@keyframes glitch{
  0%{transform:translate(0);}
  25%{transform:translate(-2px,2px);}
  50%{transform:translate(2px,-2px);}
  75%{transform:translate(-1px,-1px);}
  100%{transform:translate(0);}
}

.album-title{
  text-align:center;
  padding:10px;
}

/* Streaming Links */
.stream-link{
  font-weight:bold;
  text-shadow:0 0 8px currentColor;
}
.spotify{color:#1DB954;}
.deezer{color:#FF0000;}
.youtube{color:#FF0000;}
.suno{color:#00ffff;}
</style>
</head>

<body class="crt">

<div id="crtToggle">Toggle CRT</div>
<a id="floatingMerch" href="https://toastybonesmerch.printful.me/" target="_blank">🛒 Merch</a>

<div id="merchBanner">
<img src="merchbanner.png" alt="Merch Banner">
</div>

<section class="py-20 text-center">
<h1 class="section-title">ToastyBones</h1>
<p>AI-powered pop punk chaos.</p>
<p style="margin-top:10px;font-size:18px;color:#ff00ff;">I'm Just Stupid</p>
</section>

<section id="albums" class="py-20 px-6 text-center">
<h2 class="section-title">Albums</h2>
<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-8 max-w-6xl mx-auto">

<a href="https://open.spotify.com/album/5QsBEo2w5hLwTcXbEVtVzI" target="_blank" class="album-card">
<img src="HilariouslyUnfortunate.png" alt="Hilariously Unfortunate">
<div class="album-title">Hilariously Unfortunate</div>
</a>

<a href="https://open.spotify.com/album/7A2epK5YtI0AwzekuFQa2J" target="_blank" class="album-card">
<img src="bd2rotd.png" alt="Big Dump 2: Return of the Dump">
<div class="album-title">Big Dump 2: Return of the Dump</div>
</a>

<a href="https://open.spotify.com/album/4Se3IXXD8jRjuleluQTjf3" target="_blank" class="album-card">
<img src="spobbly not.png" alt="Spobbly Not">
<div class="album-title">Spobbly Not</div>
</a>

</div>
</section>

<section class="py-20 text-center">
<h2 class="section-title">Listen Everywhere</h2>
<div class="space-y-4">
<a class="stream-link spotify" href="https://open.spotify.com/artist/2VyZ4NBBwy9UIs8AcoMlH2" target="_blank">Spotify</a><br>
<a class="stream-link deezer" href="https://www.deezer.com/us/artist/341627971#" target="_blank">Deezer</a><br>
<a class="stream-link youtube" href="https://www.youtube.com/@ToastyBonesMusic" target="_blank">YouTube Music</a><br>
<a class="stream-link suno" href="https://suno.com/@toastybones" target="_blank">Suno</a>
</div>
</section>

<footer class="py-10 text-center text-gray-400">
© <span id="year"></span> ToastyBones
</footer>

document.getElementById("crtToggle").addEventListener("click",()=>{
document.body.classList.toggle("crt");
});
</script>

</body>
</html>
