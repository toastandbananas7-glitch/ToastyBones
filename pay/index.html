<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0c12">
<title>Pay Evan · ToastyBones</title>
<!-- Card show payment page (2026-11-18). Reached from NFC tags and QR codes only; not linked from the homepage. Remove after the show. -->
<style>
  :root { --bg: #0b0c12; --panel: #161927; --line: rgba(255,255,255,0.12); --text: #f4f5fb; --dim: #9aa0b5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 500 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         min-height: 100vh; display: flex; justify-content: center; padding: 32px 16px 48px; }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 30px; line-height: 1.15; margin-bottom: 6px; }
  .sub { color: var(--dim); margin-bottom: 26px; }
  .pay { display: block; width: 100%; padding: 18px 20px; margin-bottom: 14px; border-radius: 16px; border: 1px solid var(--line);
         background: var(--panel); color: var(--text); text-decoration: none; font-weight: 700; font-size: 19px; }
  .pay small { display: block; margin-top: 2px; color: var(--dim); font-weight: 500; font-size: 14px; }
  .pay:active, .pay:hover { border-color: #fff; }
  .cash { border-left: 8px solid #00d632; }
  .venmo { border-left: 8px solid #3d95ce; }
  .paypal { border-left: 8px solid #ffc439; }
  .foot { margin-top: 22px; color: var(--dim); font-size: 14px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Pay Evan</h1>
  <p class="sub">Pick whichever app you use. Thanks for stopping by the table.</p>
  <a class="pay cash" href="https://cash.app/$Toastandbananas" rel="noopener">Cash App<small>$Toastandbananas</small></a>
  <a class="pay venmo" href="https://venmo.com/code?user_id=4082603208476582348&amp;created=1795044856" rel="noopener">Venmo<small>Opens Evan's Venmo</small></a>
  <a class="pay paypal" href="https://www.paypal.me/toastandbananas" rel="noopener">PayPal<small>paypal.me/toastandbananas</small></a>
  <p class="foot">ToastyBones</p>
</main>
</body>
</html>
